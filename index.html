
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>סורק משתתפות</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 18px;
      background: #f7f8fb;
    }

    input, button {
      font-size: 19px;
      padding: 13px;
      margin: 8px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    input { max-width: 95%; }

    button {
      background: #2455aa;
      color: white;
      border: 0;
    }

    button:disabled { opacity: 0.5; }

    #reader {
      width: 100%;
      max-width: 450px;
      min-height: 100px;
      margin: 15px auto;
      background: #eeeeee;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      min-height: 200px;
      object-fit: cover;
    }

    #status {
      font-size: 19px;
      white-space: pre-wrap;
    }

    #result {
      display: none;
      padding: 22px;
      margin: 15px auto;
      max-width: 450px;
      border-radius: 12px;
      font-size: 23px;
      font-weight: bold;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #responseFrame {
      display: none;
      width: 100%;
      max-width: 450px;
      height: 170px;
      border: 0;
      background: white;
    }

    .success { background: #b8efb5; }
    .error { background: #ffcccc; }
  </style>
</head>

<body>
  <h2>סורק משתתפות</h2>

  <section id="login">
    <p>הזיני קוד צוות</p>
    <input id="pin" type="password" placeholder="קוד צוות"
           autocomplete="current-password">
    <br>
    <button id="startButton" onclick="startScanner()">
      כניסה והפעלת מצלמה
    </button>
  </section>

  <section id="scannerArea" style="display:none">
    <p id="status">מכינה מצלמה...</p>
    <div id="reader"></div>
    <div id="result"></div>

    <button id="nextButton" style="display:none"
            onclick="scanNext()">סריקת המשתתפת הבאה</button>

    <button onclick="stopScanner()">יציאה</button>
  </section>

  <iframe id="responseFrame" name="responseFrame"
          title="תוצאת בדיקה"></iframe>

  <form id="requestForm" method="POST" target="responseFrame"
        action="https://script.google.com/macros/s/AKfycbxrpudd3OLhboj3qDZXb6_8T04RUE00ORnxVhMPqwnpOlLM0lUY_U1iJVXVafb8qm-gAg/exec">
    <input type="hidden" name="action" value="redeem">
    <input type="hidden" name="pin" id="formPin">
    <input type="hidden" name="id" id="formId">
  </form>

<script>
  let scanner = null;
  let busy = false;
  let staffPin = "";
  let waitingForResponse = false;
  let responseTimer = null;

  function setStatus(message) {
    document.getElementById("status").textContent = message;
  }

  function showResult(message, success) {
    const el = document.getElementById("result");
    el.textContent = message;
    el.className = success ? "success" : "error";
    el.style.display = "block";
  }

  async function startScanner() {
    staffPin = document.getElementById("pin").value.trim();

    if (!staffPin) {
      alert("הזיני קוד צוות");
      return;
    }

    document.getElementById("startButton").disabled = true;
    document.getElementById("login").style.display = "none";
    document.getElementById("scannerArea").style.display = "block";
    setStatus("פותחת מצלמה...");

    try {
      if (typeof Html5Qrcode === "undefined") {
        throw new Error("ספריית הסריקה לא נטענה. בדקי את החיבור לאינטרנט.");
      }

      scanner = new Html5Qrcode("reader", { verbose: false });

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: function(width, height) {
            const size = Math.floor(Math.min(width, height) * 0.75);
            return { width: size, height: size };
          },
          disableFlip: true
        },
        onScanSuccess,
        function() {}
      );

      setStatus("המצלמה פעילה. כווני לקוד QR.");

    } catch (error) {
      setStatus("לא ניתן לפתוח מצלמה: " + (error.message || error));
      document.getElementById("login").style.display = "block";
      document.getElementById("scannerArea").style.display = "none";
      document.getElementById("startButton").disabled = false;
    }
  }

  async function onScanSuccess(decodedText) {
    if (busy) return;

    let id = decodedText.trim();

    try {
      const parsed = new URL(id);
      if (parsed.protocol === "http:" || parsed.protocol === "https:") {
        id = parsed.searchParams.get("id") || id;
      }
    } catch (e) {}

    if (!id) return;

    busy = true;
    waitingForResponse = true;

    setStatus("בודקת משתתפת...");
    document.getElementById("nextButton").style.display = "none";
    document.getElementById("result").style.display = "none";

    try {
      await scanner.pause(true);
    } catch (e) {}

    document.getElementById("formPin").value = staffPin;
    document.getElementById("formId").value = id;

    // אם לא מגיעה תשובה, מציגים הודעה במקום להיתקע ללא הסבר.
    clearTimeout(responseTimer);
    responseTimer = setTimeout(() => {
      if (waitingForResponse) {
        setStatus("עדיין ממתינה לתשובת גוגל. אל תסרקי שוב בינתיים.");
      }
    }, 12000);

    document.getElementById("requestForm").submit();
  }

  function scanNext() {
    clearTimeout(responseTimer);
    waitingForResponse = false;
    busy = false;

    document.getElementById("responseFrame").src = "about:blank";
    document.getElementById("result").style.display = "none";
    document.getElementById("nextButton").style.display = "none";

    setStatus("כווני את המצלמה לקוד הבא.");

    if (scanner) {
      try {
        scanner.resume();
      } catch (e) {
        setStatus("לא ניתן להמשיך בסריקה. רענני את הדף.");
      }
    }
  }

  document.getElementById("responseFrame").addEventListener("load", function() {
    if (!waitingForResponse || !busy) return;

    clearTimeout(responseTimer);
    setStatus("התקבלה תגובת שרת. אם התוצאה לא מופיעה, נבדוק את החיבור.");
    document.getElementById("nextButton").style.display = "inline-block";
  });

  async function stopScanner() {
    clearTimeout(responseTimer);
    waitingForResponse = false;
    busy = true;

    if (scanner) {
      try {
        await scanner.stop();
        scanner.clear();
      } catch (e) {}
      scanner = null;
    }

    staffPin = "";
    document.getElementById("pin").value = "";
    document.getElementById("login").style.display = "block";
    document.getElementById("scannerArea").style.display = "none";
    document.getElementById("startButton").disabled = false;
    document.getElementById("responseFrame").src = "about:blank";
  }
</script>
</body>
</html>
