
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סורק משתתפות</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 18px;
      background: #f7f8fb;
    }

    input, button {
      font-size: 19px;
      padding: 12px;
      margin: 7px;
      border-radius: 9px;
      box-sizing: border-box;
    }

    input {
      max-width: 90%;
    }

    button {
      border: 0;
      background: #2455aa;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 12px auto;
      background: white;
    }

    #status {
      font-size: 18px;
      white-space: pre-wrap;
    }

    #responseFrame {
      width: 100%;
      max-width: 450px;
      height: 180px;
      border: 0;
      margin: 12px auto;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h2>סורק משתתפות</h2>

  <div id="login">
    <p>הזיני קוד צוות</p>
    <input
      id="pin"
      type="password"
      placeholder="קוד צוות"
      autocomplete="current-password"
    >
    <br>
    <button id="loginButton" onclick="startScanner()">
      כניסה והפעלת מצלמה
    </button>
  </div>

  <div id="scannerArea" style="display:none">
    <p id="status">ממתין להפעלת המצלמה...</p>
    <div id="reader"></div>

    <button
      id="nextButton"
      style="display:none"
      onclick="scanNext()"
    >
      סריקת המשתתפת הבאה
    </button>

    <button onclick="stopScanner()">יציאה</button>
  </div>

  <iframe
    id="responseFrame"
    name="responseFrame"
    title="תוצאת בדיקת המשתתפת"
  ></iframe>

  <form
    id="requestForm"
    method="POST"
    target="responseFrame"
    action="https://script.google.com/macros/s/AKfycbxrpudd3OLhboj3qDZXb6_8T04RUE00ORnxVhMPqwnpOlLM0lUY_U1iJVXVafb8qm-gAg/exec"
  >
    <input type="hidden" name="action" value="redeem">
    <input type="hidden" id="formPin" name="pin">
    <input type="hidden" id="formId" name="id">
  </form>

<script>
  let scanner = null;
  let busy = false;
  let staffPin = "";
  let requestStarted = false;

  function showStatus(message) {
    document.getElementById("status").textContent = message;
  }

  async function startScanner() {
    staffPin = document.getElementById("pin").value.trim();

    if (!staffPin) {
      alert("הזיני קוד צוות");
      return;
    }

    document.getElementById("loginButton").disabled = true;
    document.getElementById("login").style.display = "none";
    document.getElementById("scannerArea").style.display = "block";
    showStatus("פותח מצלמה...");

    try {
      if (typeof Html5Qrcode === "undefined") {
        throw new Error("ספריית הסריקה לא נטענה. בדקי את החיבור לאינטרנט.");
      }

      scanner = new Html5Qrcode("reader", { verbose: false });

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: function(width, height) {
            const size = Math.floor(Math.min(width, height) * 0.75);
            return { width: size, height: size };
          },
          disableFlip: true
        },
        onScanSuccess,
        function() {}
      );

      showStatus("המצלמה פעילה. כווני לקוד QR.");

    } catch (error) {
      showStatus("לא ניתן לפתוח מצלמה: " + (error.message || error));

      document.getElementById("login").style.display = "block";
      document.getElementById("scannerArea").style.display = "none";
      document.getElementById("loginButton").disabled = false;
    }
  }

  async function onScanSuccess(decodedText) {
    if (busy) return;

    let participantID = decodedText.trim();

    // תומך גם ב-QR המכיל מזהה וגם ב-QR המכיל כתובת עם פרמטר id
    try {
      const parsed = new URL(participantID);

      if (parsed.protocol === "https:" || parsed.protocol === "http:") {
        participantID = parsed.searchParams.get("id") || participantID;
      }
    } catch (e) {
      // הטקסט אינו כתובת, ולכן מתייחסים אליו כמזהה
    }

    if (!participantID) {
      showStatus("לא נמצא מזהה בקוד");
      return;
    }

    busy = true;
    requestStarted = true;

    showStatus("בודקת משתתפת...");

    document.getElementById("nextButton").style.display = "none";

    try {
      await scanner.pause(true);
    } catch (e) {}

    document.getElementById("formPin").value = staffPin;
    document.getElementById("formId").value = participantID;

    document.getElementById("requestForm").submit();
  }

  async function scanNext() {
    if (!scanner) return;

    busy = false;
    requestStarted = false;

    document.getElementById("responseFrame").src = "about:blank";
    document.getElementById("nextButton").style.display = "none";

    showStatus("כווני את המצלמה לקוד הבא.");

    try {
      await scanner.resume();
    } catch (error) {
      showStatus("לא ניתן להמשיך בסריקה. נסי לרענן את הדף.");
    }
  }

  async function stopScanner() {
    busy = true;

    if (scanner) {
      try {
        await scanner.stop();
        scanner.clear();
      } catch (e) {}

      scanner = null;
    }

    staffPin = "";
    requestStarted = false;

    document.getElementById("pin").value = "";
    document.getElementById("login").style.display = "block";
    document.getElementById("scannerArea").style.display = "none";
    document.getElementById("loginButton").disabled = false;
    document.getElementById("responseFrame").src = "about:blank";

    showStatus("");
  }

  document.getElementById("responseFrame").addEventListener("load", function() {
    if (!requestStarted || !busy) return;

    showStatus("התקבלה תגובה מהשרת. בדקי את התוצאה במסגרת שמתחת לסורק.");
    document.getElementById("nextButton").style.display = "inline-block";
  });
</script>

</body>
</html>
