
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיקת חיבור לגוגל</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    button {
      font-size: 20px;
      padding: 15px;
    }
    #result {
      margin-top: 25px;
      font-size: 18px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>בדיקת חיבור לגוגל</h2>
  <button onclick="testConnection()">בדיקת חיבור</button>
  <div id="result"></div>

  <script>
    const GOOGLE_URL =
      "https://script.google.com/macros/s/AKfycbxrpudd3OLhboj3qDZXb6_8T04RUE00ORnxVhMPqwnpOlLM0lUY_U1iJVXVafb8qm-gAg/exec";

    async function testConnection() {
      const result = document.getElementById("result");
      result.textContent = "שולח בקשה לגוגל...";

      try {
        await fetch(GOOGLE_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "connectionTest"
          })
        });

        result.textContent =
          "הדפדפן שלח את הבקשה ללא שגיאת רשת גלויה.\n" +
          "עדיין צריך לבדוק בגוגל אם היא התקבלה.";

      } catch (error) {
        result.textContent =
          "שגיאה בשליחת הבקשה: " + error.message;
      }
    }
  </script>
</body>
</html>
